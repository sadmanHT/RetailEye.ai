version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retaileye_api
    ports:
      - "8000:8000"
    volumes:
      - model_weights:/app/models/weights
    env_file:
      - .env
    networks:
      - retaileye-network
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: retaileye_frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - retaileye-network

  redis:
    image: redis:7-alpine
    container_name: retaileye_redis
    ports:
      - "6379:6379"
    networks:
      - retaileye-network

networks:
  retaileye-network:
    driver: bridge

volumes:
  model_weights:
